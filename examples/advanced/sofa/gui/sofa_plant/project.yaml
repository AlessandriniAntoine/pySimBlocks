schema_version: 1
project:
  name: sofa_plant
simulation:
  dt: 0.01
  T: 5.0
  solver: fixed
  npz_decimation: 1
  logging:
  - sum.outputs.out
  - sofa.outputs.measure
  - ref.outputs.out
  plots:
  - title: Outputs
    signals:
    - sofa.outputs.measure
    - ref.outputs.out
  - title: Command
    signals:
    - sum.outputs.out
diagram:
  blocks:
  - name: error
    category: operators
    type: sum
    uid: c6bab231f37c45caa784dd9c03f829ef
    parameters:
      signs: +-
  - name: Kp
    category: operators
    type: gain
    uid: 40a87934609741679a9d9cd5a722cc43
    parameters:
      gain: [[0.5]]
      multiplication: Element wise (K * u)
  - name: Ki
    category: operators
    type: gain
    uid: 9a27b8241a97449bb352a16306bae4f9
    parameters:
      gain: [[0.8]]
      multiplication: Element wise (K * u)
  - name: integrator
    category: operators
    type: discrete_integrator
    uid: 51abe35bd3704bb1a806e89bfdb4d1cd
    parameters:
      initial_state: [[0.0]]
      method: euler forward
  - name: sum
    category: operators
    type: sum
    uid: 0244b63908194325ae41457b859e1469
    parameters:
      signs: ++
  - name: sofa
    category: systems
    type: sofa_plant
    uid: c8b05555139047a893e4a59a7d688c61
    parameters:
      scene_file: ../finger/Finger.py
      input_keys:
      - cable
      output_keys:
      - tip
      - measure
      slider_params:
        ref.value:
        - -10.0
        - 50.0
        Kp.gain:
        - 0.01
        - 3.0
        Ki.gain:
        - 0.01
        - 3.0
  - name: ref
    category: sources
    type: constant
    uid: 9870fec5db1748b19dea1c0439163dff
    parameters:
      value: [[1.0]]
  connections:
  - name: c1
    ports:
    - error.out
    - Kp.in
  - name: c2
    ports:
    - error.out
    - integrator.in
  - name: c3
    ports:
    - Kp.out
    - sum.in1
  - name: c4
    ports:
    - Ki.out
    - sum.in2
  - name: c5
    ports:
    - sum.out
    - sofa.cable
  - name: c6
    ports:
    - sofa.measure
    - error.in2
  - name: c7
    ports:
    - ref.out
    - error.in1
  - name: c8
    ports:
    - integrator.out
    - Ki.in
gui:
