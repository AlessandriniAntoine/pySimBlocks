        orientation: normal
        width: 120.0
        height: 60.0
      Ki:
        x: 140.0
        y: 5.0
        orientation: normal
        width: 120.0
        height: 60.0
      integrator:
        x: -35.0
        y: 5.0
        orientation: normal
        width: 120.0
        height: 60.0
      sum:
        x: 300.0
        y: -75.0
        orientation: normal
        width: 120.0
        height: 60.0
      sofa:
        x: 490.0
        y: -75.0
        orientation: normal
        width: 120.0
